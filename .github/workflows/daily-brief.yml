name: Daily Brief

on:
  # 2026-09-27 恢復 GitHub 自己排程：v3 只靠外部 routine 觸發，routine 6/23 停掉後簡報無聲無息死了 3 個月。
  # 代價是 free tier 可能延遲數小時；排在台北 07:30，延遲也多半在白天送達。
  schedule:
    - cron: '30 23 * * *'   # UTC 23:30 = 台北 07:30
  workflow_dispatch:  # 手動觸發測試
  repository_dispatch:
    types: [daily_brief]

# 防止排程和外部觸發同時跑，發出兩份
concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily brief
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_NEWS: ${{ secrets.DISCORD_WEBHOOK_NEWS }}
        run: python daily_brief.py
